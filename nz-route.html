<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NZ South Island — 14-Day Route</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700;900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root {
  --canvas: #faf9f5;
  --surface: #ffffff;
  --surface-alt: #f0eeea;
  --ink: #141413;
  --body: #5c5a55;
  --muted: #94918a;
  --hairline: #e4e1db;
  --coral: #cc785c;
  --coral-hover: #a9583e;
  --radius-card: 20px;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
  --shadow-rest: 0 1px 3px rgba(0,0,0,0.04);
  --space-sm: 12px;
  --space-md: 20px;
  --space-lg: 28px;
  --space-xl: 32px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--canvas);
  font-family: var(--font-body);
  color: var(--body);
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 920px;
  margin: 0 auto;
  padding: 0 var(--space-xl);
}

/* Hero */
.hero {
  padding: var(--space-lg) 0 var(--space-md);
}
.kicker {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--coral);
  margin-bottom: 8px;
}
.hero h1 {
  font-family: var(--font-display);
  font-size: clamp(28px, 5vw, 42px);
  font-weight: 900;
  color: var(--ink);
  line-height: 1.1;
  margin-bottom: 8px;
}
.subtitle {
  font-size: 15px;
  color: var(--muted);
  line-height: 1.5;
}

/* Map */
.map-card {
  background: var(--surface);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-rest);
  overflow: hidden;
  margin-bottom: var(--space-lg);
}
#map {
  height: 60vh;
  min-height: 400px;
  width: 100%;
}

/* Legend */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: var(--space-md);
  border-top: 1px solid var(--hairline);
}
.legend-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  background: var(--surface-alt);
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}
.legend-chip:hover { opacity: 0.75; }
.legend-chip.active {
  color: #fff;
}
.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

/* Day cards */
.days-section {
  margin-bottom: var(--space-xl);
}
.section-header {
  margin-bottom: var(--space-md);
}
.section-label {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--coral);
  margin-bottom: 4px;
}
.section-title {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 900;
  color: var(--ink);
}
.day-cards {
  display: grid;
  gap: var(--space-sm);
}
.day-card {
  background: var(--surface);
  border-radius: 14px;
  padding: var(--space-md);
  border-left: 4px solid transparent;
  box-shadow: var(--shadow-rest);
  display: flex;
  gap: var(--space-md);
  align-items: flex-start;
}
.day-card .day-num {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 900;
  min-width: 42px;
  line-height: 1;
  padding-top: 2px;
}
.day-card .day-info { flex: 1; }
.day-card .day-route {
  font-weight: 700;
  font-size: 14px;
  color: var(--ink);
  margin-bottom: 6px;
}
.day-card .day-stops {
  font-size: 13px;
  color: var(--body);
  line-height: 1.5;
}

/* Footer */
.footer {
  text-align: center;
  padding: var(--space-lg) 0;
  font-size: 12px;
  color: var(--muted);
}

@media (max-width: 600px) {
  .day-card .day-num { font-size: 22px; min-width: 32px; }
  .day-card .day-route { font-size: 13px; }
  .day-card .day-stops { font-size: 12px; }
  .legend { gap: 4px; }
  .legend-chip { font-size: 10px; padding: 3px 8px; }
}
</style>
</head>
<body>
<div class="app">

<section class="hero">
  <div class="kicker">New Zealand · South Island</div>
  <h1>14-Day Route</h1>
  <p class="subtitle">Christchurch loop via the West Coast, Queenstown, Milford Sound &amp; Aoraki. Tap the map markers or legend to explore each day.</p>
</section>

<div class="map-card">
  <div id="map"></div>
  <div class="legend" id="legend"></div>
</div>

<section class="days-section">
  <div class="section-header">
    <div class="section-label">Itinerary</div>
    <div class="section-title">Day by Day</div>
  </div>
  <div class="day-cards" id="dayCards"></div>
</section>

<div class="footer">Gary (Josh's P.A) · 12 Aug 2026</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── DAY COLOURS ────────────────────────────
const DAY_COLORS = [
  '#1a73e8', '#e8710a', '#0d904f', '#7b1fa2',
  '#c62828', '#00838f', '#2e7d32', '#f9a825',
  '#6d4c41', '#d81b60', '#5c6bc0', '#00acc1',
  '#e64a19', '#455a64'
];

// ── ROUTE DATA ─────────────────────────────
const days = [
  {
    num: 1,
    route: 'Christchurch → Castle Hill',
    stops: [
      { name: 'Christchurch', lat: -43.5320, lng: 172.6306, type: 'start' },
      { name: 'Springfield', lat: -43.3376, lng: 171.9276, note: 'pass through' },
      { name: 'Castle Hill', lat: -43.2167, lng: 171.7167, type: 'stay' }
    ],
    note: 'Late start ~4pm, short drive'
  },
  {
    num: 2,
    route: 'Cave Stream → Arthur\'s Pass → Hokitika',
    stops: [
      { name: 'Cave Stream', lat: -43.2007, lng: 171.7469, type: 'activity' },
      { name: 'Arthur\'s Pass', lat: -42.9476, lng: 171.5666, type: 'stop' },
      { name: 'Hokitika', lat: -42.7170, lng: 170.9619, type: 'stay' }
    ],
    note: 'Full day — start early'
  },
  {
    num: 3,
    route: 'Hokitika Gorge → Okarito → Franz Josef',
    stops: [
      { name: 'Hokitika Gorge', lat: -42.9510, lng: 171.0167, type: 'activity' },
      { name: 'Okarito', lat: -43.2060, lng: 170.1620, type: 'stop' },
      { name: 'Franz Josef', lat: -43.3875, lng: 170.1826, type: 'stay' }
    ],
    note: 'Coastal scenery and glacier town'
  },
  {
    num: 4,
    route: 'Franz Josef',
    stops: [
      { name: 'Franz Josef', lat: -43.3875, lng: 170.1826, type: 'stay' }
    ],
    note: 'Full day for glacier activities / weather buffer'
  },
  {
    num: 5,
    route: 'Franz Josef → Haast',
    stops: [
      { name: 'Fox Glacier', lat: -43.4643, lng: 170.0173, type: 'stop' },
      { name: 'Bruce Bay', lat: -43.6020, lng: 169.5750, type: 'stop' },
      { name: 'Ship Creek', lat: -43.7580, lng: 169.2290, type: 'stop' },
      { name: 'Haast', lat: -43.8810, lng: 169.0424, type: 'stay' }
    ],
    note: 'West Coast scenery day'
  },
  {
    num: 6,
    route: 'Haast → Wanaka',
    stops: [
      { name: 'Haast Pass', lat: -44.1073, lng: 169.3547, type: 'stop' },
      { name: 'Blue Pools', lat: -44.1630, lng: 169.2790, type: 'activity' },
      { name: 'Lake Hawea', lat: -44.4960, lng: 169.2870, type: 'stop' },
      { name: 'Wanaka', lat: -44.7032, lng: 169.1322, type: 'stay' }
    ],
    note: 'Haast Pass and alpine lakes'
  },
  {
    num: 7,
    route: 'Wanaka',
    stops: [
      { name: 'Wanaka', lat: -44.7032, lng: 169.1322, type: 'stay' }
    ],
    note: 'Two nights — explore Wanaka'
  },
  {
    num: 8,
    route: 'Wanaka',
    stops: [
      { name: 'Wanaka', lat: -44.7032, lng: 169.1322, type: 'stay' }
    ],
    note: 'Two nights — explore Wanaka'
  },
  {
    num: 9,
    route: 'Queenstown',
    stops: [
      { name: 'Queenstown', lat: -45.0312, lng: 168.6626, type: 'stay' }
    ],
    note: 'Two nights — adventure capital'
  },
  {
    num: 10,
    route: 'Queenstown',
    stops: [
      { name: 'Queenstown', lat: -45.0312, lng: 168.6626, type: 'stay' }
    ],
    note: 'Two nights — adventure capital'
  },
  {
    num: 11,
    route: 'Queenstown → Te Anau',
    stops: [
      { name: 'Queenstown', lat: -45.0312, lng: 168.6626, type: 'start' },
      { name: 'Te Anau', lat: -45.4145, lng: 167.7181, type: 'stay' }
    ],
    note: 'Gateway to Milford Sound'
  },
  {
    num: 12,
    route: 'Milford Sound',
    stops: [
      { name: 'Te Anau', lat: -45.4145, lng: 167.7181, type: 'start' },
      { name: 'Milford Sound', lat: -44.6560, lng: 167.9240, type: 'activity' }
    ],
    note: 'Full day — return to Te Anau'
  },
  {
    num: 13,
    route: 'Te Anau → Mt Cook / Pukaki',
    stops: [
      { name: 'Te Anau', lat: -45.4145, lng: 167.7181, type: 'start' },
      { name: 'Lake Pukaki', lat: -43.9880, lng: 170.4650, type: 'stop' },
      { name: 'Mt Cook Village', lat: -43.7330, lng: 170.0960, type: 'stay' }
    ],
    note: 'Longish driving day but spectacular scenery'
  },
  {
    num: 14,
    route: 'Mt Cook → Tekapo → Christchurch',
    stops: [
      { name: 'Mt Cook Village', lat: -43.7330, lng: 170.0960, type: 'start' },
      { name: 'Lake Tekapo', lat: -44.0047, lng: 170.4771, type: 'stop' },
      { name: 'Christchurch', lat: -43.5320, lng: 172.6306, type: 'end' }
    ],
    note: 'Mackenzie Country — home via Tekapo'
  }
];

// ── ICON FACTORY ───────────────────────────
function makeIcon(color, label) {
  const size = label ? 28 : 14;
  const html = label
    ? `<svg width="28" height="36" viewBox="0 0 28 36"><circle cx="14" cy="14" r="13" fill="${color}" stroke="#fff" stroke-width="2"/><text x="14" y="18" text-anchor="middle" fill="#fff" font-size="12" font-weight="800" font-family="Inter,sans-serif">${label}</text><polygon points="14,36 6,26 22,26" fill="${color}"/></svg>`
    : `<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="${color}" stroke="#fff" stroke-width="2"/></svg>`;
  return L.divIcon({ html, className: '', iconSize: [size, size+8], iconAnchor: [size/2, size+8], popupAnchor: [0, -(size+4)] });
}

// ── MAP ─────────────────────────────────────
const bounds = [[-46, 166], [-42, 174]];
const map = L.map('map', { zoomControl: true, scrollWheelZoom: true }).setView([-43.8, 170.5], 7);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
  maxZoom: 19
}).addTo(map);

// Store layers
const markersByDay = [];
const linesByDay = [];

days.forEach((day, idx) => {
  const color = DAY_COLORS[idx];
  const markers = [];
  const dayKey = idx + 1;

  // Add markers for each stop
  day.stops.forEach((stop, si) => {
    const isKey = stop.type === 'start' || stop.type === 'end' || stop.type === 'stay' || stop.type === 'activity';
    const icon = isKey ? makeIcon(color, String(dayKey)) : makeIcon(color);
    const marker = L.marker([stop.lat, stop.lng], { icon }).addTo(map);
    marker.bindPopup(`<b>Day ${dayKey}</b><br>${stop.name}${stop.note ? ' — <em>' + stop.note + '</em>' : ''}`);
    marker._dayKey = dayKey;
    markers.push(marker);
  });

  // Draw line between consecutive stops
  if (day.stops.length >= 2) {
    const coords = day.stops.map(s => [s.lat, s.lng]);
    const line = L.polyline(coords, { color, weight: 3, opacity: 0.7, dashArray: '8 4' }).addTo(map);
    line._dayKey = dayKey;
    linesByDay.push(line);
  }

  markersByDay.push({ key: dayKey, markers });
});

// ── LEGEND ─────────────────────────────────
const legend = document.getElementById('legend');
let activeDay = null;

days.forEach((day, idx) => {
  const chip = document.createElement('div');
  chip.className = 'legend-chip';
  chip.innerHTML = `<span class="legend-dot" style="background:${DAY_COLORS[idx]}"></span>Day ${idx+1}`;
  chip.addEventListener('click', () => toggleDay(idx + 1, chip));
  legend.appendChild(chip);
});

function toggleDay(dayKey, chip) {
  if (activeDay === dayKey) {
    // Deselect — show all
    activeDay = null;
    document.querySelectorAll('.legend-chip').forEach(c => c.classList.remove('active'));
    showAll();
    return;
  }

  activeDay = dayKey;
  document.querySelectorAll('.legend-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  chip.style.background = DAY_COLORS[dayKey - 1];

  // Hide all, then show selected
  markersByDay.forEach(d => d.markers.forEach(m => map.removeLayer(m)));
  linesByDay.forEach(l => map.removeLayer(l));

  markersByDay.forEach(d => {
    if (d.key === dayKey) {
      d.markers.forEach(m => map.addLayer(m));
    }
  });
  linesByDay.forEach(l => {
    if (l._dayKey === dayKey) map.addLayer(l);
  });

  // Zoom to day
  const dayMarkers = markersByDay.find(d => d.key === dayKey).markers;
  if (dayMarkers.length >= 2) {
    const group = L.featureGroup(dayMarkers);
    map.fitBounds(group.getBounds(), { padding: [50, 50], maxZoom: 11 });
  } else if (dayMarkers.length === 1) {
    map.setView(dayMarkers[0].getLatLng(), 11);
  }
}

function showAll() {
  markersByDay.forEach(d => d.markers.forEach(m => map.addLayer(m)));
  linesByDay.forEach(l => map.addLayer(l));
  // Fit to full route
  const allMarkers = markersByDay.flatMap(d => d.markers);
  if (allMarkers.length) {
    map.fitBounds(L.featureGroup(allMarkers).getBounds(), { padding: [30, 30] });
  }
}

// ── DAY CARDS ──────────────────────────────
const dayCards = document.getElementById('dayCards');
days.forEach((day, idx) => {
  const color = DAY_COLORS[idx];
  const card = document.createElement('div');
  card.className = 'day-card';
  card.style.borderLeftColor = color;
  card.style.cursor = 'pointer';
  card.innerHTML = `
    <div class="day-num" style="color:${color}">${idx+1}</div>
    <div class="day-info">
      <div class="day-route">${day.route}</div>
      <div class="day-stops">${day.note}</div>
    </div>
  `;
  card.addEventListener('click', () => {
    const chip = legend.children[idx];
    toggleDay(idx + 1, chip);
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  dayCards.appendChild(card);
});
</script>
</body>
</html>
