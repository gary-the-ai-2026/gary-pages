<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Energy · Hancock</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700;900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --canvas: #faf9f5;
  --surface: #ffffff;
  --surface-alt: #f0eeea;
  --ink: #141413;
  --body: #5c5a55;
  --muted: #94918a;
  --hairline: #e4e1db;
  --hairline-soft: #ece9e4;
  --coral: #cc785c;
  --solar: #e8a838;
  --solar-glow: #f5c85a;
  --battery: #4a9e6e;
  --battery-glow: #6bc48a;
  --grid: #5b8cb8;
  --grid-glow: #80b4e0;
  --home: #cc785c;
  --radius: 20px;
  --radius-sm: 12px;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background: var(--canvas);
  color: var(--body);
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }

/* Hero */
.hero { text-align: center; padding: 10px 0 4px; }
.hero .kicker { font-size: 0.7rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--coral); }
.hero h1 { font-family: var(--font-display); font-size: 2rem; font-weight: 900; color: var(--ink); letter-spacing: -0.5px; margin: 2px 0 0; }
.hero .timestamp { font-size: 0.78rem; color: var(--muted); font-family: var(--font-mono); margin-top: 2px; }

/* === FLOW DIAGRAM WITH HOUSE IMAGE === */
.flow-diagram {
  position: relative;
  margin: 16px 0;
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--canvas);
  /* subtle border */
  box-shadow: 0 0 0 1px var(--hairline);
}
.flow-diagram svg {
  display: block;
  width: 100%;
  height: auto;
}

/* Flow paths */
.flow-path {
  fill: none;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 8 6;
  opacity: 0.15;
  transition: opacity 0.6s;
}
.flow-path.active {
  opacity: 0.75;
  animation: flowDash 1.2s linear infinite;
}
@keyframes flowDash { to { stroke-dashoffset: -28; } }

/* Particles */
.flow-particle { opacity: 0; }
.flow-particle.active { opacity: 0.9; }

/* Particle colors */
.flow-particle.solar { fill: var(--solar-glow); filter: drop-shadow(0 0 4px rgba(232,168,56,0.7)); }
.flow-particle.battery { fill: var(--battery-glow); filter: drop-shadow(0 0 4px rgba(74,158,110,0.7)); }
.flow-particle.grid { fill: var(--grid-glow); filter: drop-shadow(0 0 4px rgba(91,140,184,0.7)); }
.flow-particle.export { fill: #e88a8a; filter: drop-shadow(0 0 4px rgba(200,60,60,0.6)); }

/* Path colors */
.flow-path.solar { stroke: var(--solar); }
.flow-path.battery { stroke: var(--battery); }
.flow-path.grid { stroke: var(--grid); }
.flow-path.export { stroke: #c0392b; }

/* Data badges — positioned absolutely over the image */
.data-badge {
  position: absolute;
  display: flex; flex-direction: column; align-items: center;
  pointer-events: none;
  transform: translate(-50%, -50%);
}
.data-badge .val {
  font-family: var(--font-display);
  font-size: clamp(16px, 3vw, 26px);
  font-weight: 900;
  color: var(--ink);
  line-height: 1.1;
  text-shadow: 0 0 8px rgba(250,249,245,0.85), 0 1px 0 rgba(250,249,245,0.6);
}
.data-badge .lbl {
  font-size: clamp(8px, 1.5vw, 10px);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
  margin-top: 1px;
}

/* Amber card */
.amber-card {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 16px 18px;
  display: flex; align-items: center; gap: 14px; margin: 16px 0;
}
.amber-price { font-family: var(--font-display); font-size: 2.2rem; font-weight: 900; color: var(--ink); line-height: 1; }
.amber-price-unit { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
.amber-meta { flex: 1; }
.amber-period {
  font-size: 0.7rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  padding: 3px 10px; border-radius: 100px; display: inline-block; margin-bottom: 4px;
}
.amber-period.solarSponge { background: #fef3d5; color: #8b6914; }
.amber-period.peak { background: #fde8e8; color: #9b1c1c; }
.amber-period.offPeak { background: #e8f0fe; color: #1e429f; }
.amber-descriptor { font-size: 0.78rem; color: var(--body); }
.amber-next { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
.amber-next strong { color: var(--ink); }

/* Price bars */
.price-bars { margin: 16px 0; }
.price-bars-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.bar-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; font-size: 0.75rem; }
.bar-time { width: 42px; font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); text-align: right; flex-shrink: 0; }
.bar-track { flex: 1; height: 22px; background: var(--surface-alt); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; display: flex; align-items: center; padding-left: 6px; font-size: 0.68rem; font-weight: 600; color: rgba(255,255,255,0.9); white-space: nowrap; }
.bar-price { width: 52px; font-family: var(--font-mono); font-size: 0.72rem; font-weight: 500; color: var(--body); text-align: left; flex-shrink: 0; }

/* Battery SoC gauge (small, below diagram) */
.soc-strip {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-sm);
  padding: 12px 16px; margin: 16px 0;
}
.soc-strip .soc-val {
  font-family: var(--font-display); font-size: 1.8rem; font-weight: 900;
  color: var(--ink); min-width: 56px;
}
.soc-strip .soc-bar-wrap {
  flex: 1; height: 14px; background: var(--surface-alt);
  border-radius: 7px; overflow: hidden;
}
.soc-strip .soc-bar-fill {
  height: 100%; border-radius: 7px;
  transition: width 0.8s ease;
}
.soc-strip .soc-meta {
  font-size: 0.72rem; color: var(--muted);
  font-family: var(--font-mono); min-width: 70px; text-align: right;
}

/* Refresh */
.refresh-bar { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; font-size: 0.7rem; color: var(--muted); }
.refresh-dot { width: 6px; height: 6px; border-radius: 50%; background: #1b8a3d; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.refresh-dot.stale { background: #c2680c; }

@keyframes shimmer { 0%{background-position:-200px 0} 100%{background-position:calc(200px + 100%) 0} }
.shimmer { background: linear-gradient(90deg,var(--surface-alt) 25%,var(--hairline) 50%,var(--surface-alt) 75%); background-size:200px 100%; animation:shimmer 1.5s infinite; border-radius:4px; }

@media (max-width:480px) {
  .hero h1 { font-size:1.6rem; }
  .amber-price { font-size:1.8rem; }
}
</style>
</head>
<body>
<div class="container">

  <div class="hero">
    <div class="kicker">119 Princes Road</div>
    <h1>Energy</h1>
    <div class="timestamp" id="timestamp">--</div>
  </div>

  <!-- FLOW DIAGRAM — house image + animated overlays -->
  <div class="flow-diagram" id="flowContainer">
    <svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
      <!-- House image -->
      <image href="images/house-energy.png" width="1200" height="1200"/>

      <!-- === FLOW PATHS === -->
      <!-- Solar→Home: from roof panels to house center -->
      <path id="pathSolarHome" class="flow-path solar active"
        d="M 650,430 C 650,470 650,500 650,530"/>
      <!-- Solar→Battery: from roof to battery unit -->
      <path id="pathSolarBat" class="flow-path solar"
        d="M 600,460 C 530,490 470,550 440,610"/>
      <!-- Battery→Home: from battery to house -->
      <path id="pathBatHome" class="flow-path battery"
        d="M 460,640 C 510,620 560,570 590,540"/>
      <!-- Grid→Home: power pole to grid connection then house -->
      <path id="pathGridHome" class="flow-path grid"
        d="M 320,350 C 370,430 410,490 410,520 C 410,530 480,540 550,540"/>
      <!-- Home→Grid: reverse -->
      <path id="pathHomeGrid" class="flow-path export"
        d="M 550,540 C 480,540 410,530 410,520 C 410,490 370,430 320,350"/>

      <!-- === PARTICLES === -->
      <!-- Solar→Home -->
      <circle class="flow-particle solar active p1" id="pSH1"><animateMotion dur="2s" repeatCount="indefinite" path="M 650,430 C 650,470 650,500 650,530"/></circle>
      <circle class="flow-particle solar active p2" id="pSH2"><animateMotion dur="2s" repeatCount="indefinite" path="M 650,430 C 650,470 650,500 650,530"/></circle>
      <circle class="flow-particle solar active p3" id="pSH3"><animateMotion dur="2s" repeatCount="indefinite" path="M 650,430 C 650,470 650,500 650,530"/></circle>
      <!-- Solar→Battery -->
      <circle class="flow-particle solar p1" id="pSB1"><animateMotion dur="2.8s" repeatCount="indefinite" path="M 600,460 C 530,490 470,550 440,610"/></circle>
      <circle class="flow-particle solar p2" id="pSB2"><animateMotion dur="2.8s" repeatCount="indefinite" path="M 600,460 C 530,490 470,550 440,610"/></circle>
      <circle class="flow-particle solar p3" id="pSB3"><animateMotion dur="2.8s" repeatCount="indefinite" path="M 600,460 C 530,490 470,550 440,610"/></circle>
      <!-- Battery→Home -->
      <circle class="flow-particle battery p1" id="pBH1"><animateMotion dur="2.8s" repeatCount="indefinite" path="M 460,640 C 510,620 560,570 590,540"/></circle>
      <circle class="flow-particle battery p2" id="pBH2"><animateMotion dur="2.8s" repeatCount="indefinite" path="M 460,640 C 510,620 560,570 590,540"/></circle>
      <circle class="flow-particle battery p3" id="pBH3"><animateMotion dur="2.8s" repeatCount="indefinite" path="M 460,640 C 510,620 560,570 590,540"/></circle>
      <!-- Grid→Home -->
      <circle class="flow-particle grid p1" id="pGH1"><animateMotion dur="3s" repeatCount="indefinite" path="M 320,350 C 370,430 410,490 410,520 C 410,530 480,540 550,540"/></circle>
      <circle class="flow-particle grid p2" id="pGH2"><animateMotion dur="3s" repeatCount="indefinite" path="M 320,350 C 370,430 410,490 410,520 C 410,530 480,540 550,540"/></circle>
      <circle class="flow-particle grid p3" id="pGH3"><animateMotion dur="3s" repeatCount="indefinite" path="M 320,350 C 370,430 410,490 410,520 C 410,530 480,540 550,540"/></circle>
      <!-- Home→Grid (export) -->
      <circle class="flow-particle export p1" id="pHG1"><animateMotion dur="3s" repeatCount="indefinite" path="M 550,540 C 480,540 410,530 410,520 C 410,490 370,430 320,350"/></circle>
      <circle class="flow-particle export p2" id="pHG2"><animateMotion dur="3s" repeatCount="indefinite" path="M 550,540 C 480,540 410,530 410,520 C 410,490 370,430 320,350"/></circle>
      <circle class="flow-particle export p3" id="pHG3"><animateMotion dur="3s" repeatCount="indefinite" path="M 550,540 C 480,540 410,530 410,520 C 410,490 370,430 320,350"/></circle>
    </svg>

    <!-- Data badges overlaid -->
    <div class="data-badge" id="badgeSolar" style="left:54%;top:30%;">
      <span class="val" id="svgSolarVal">--</span>
      <span class="lbl">Solar</span>
    </div>
    <div class="data-badge" id="badgeGrid" style="left:26%;top:23%;">
      <span class="val" id="svgGridVal">--</span>
      <span class="lbl">Grid</span>
    </div>
    <div class="data-badge" id="badgeBattery" style="left:37%;top:63%;">
      <span class="val" id="svgBatVal">--</span>
      <span class="lbl">Battery</span>
    </div>
    <div class="data-badge" id="badgeHome" style="left:54%;top:52%;">
      <span class="val" id="svgHomeVal">--</span>
      <span class="lbl">Home</span>
    </div>
  </div>

  <!-- Battery SoC strip -->
  <div class="soc-strip">
    <span class="soc-val" id="socVal">--%</span>
    <div class="soc-bar-wrap">
      <div class="soc-bar-fill" id="socBarFill" style="width:0%;background:#4a9e6e;"></div>
    </div>
    <span class="soc-meta" id="socMeta">--</span>
  </div>

  <!-- Amber -->
  <div class="amber-card">
    <div>
      <div class="amber-price" id="amberPrice">--</div>
      <div class="amber-price-unit">c/kWh</div>
    </div>
    <div class="amber-meta">
      <span class="amber-period" id="amberPeriod">--</span>
      <div class="amber-descriptor" id="amberDescriptor">--</div>
      <div class="amber-next" id="amberNext">--</div>
    </div>
  </div>

  <!-- Forward Prices -->
  <div class="price-bars">
    <div class="price-bars-label">Next 4 Hours</div>
    <div id="priceBars"><div class="shimmer" style="height:120px;"></div></div>
  </div>

  <div class="refresh-bar">
    <div class="refresh-dot" id="refreshDot"></div>
    <span id="refreshText">Live</span>
  </div>
</div>

<script>
const DATA_URL = 'data/energy-data.json';

function fmtW(v) {
  const a=Math.abs(v);
  if(a>=1000) return (a/1000).toFixed(2)+' kW';
  return Math.round(a)+' W';
}
function fmtSignedW(v) {
  if(v==null) return '--';
  const a=Math.abs(v);
  let s=a>=1000?(a/1000).toFixed(2)+' kW':Math.round(a)+' W';
  return v>=0?'+'+s:'−'+s;
}

function setFlowActive(id, active) {
  const el=document.getElementById(id);
  if(!el) return;
  if(active) el.classList.add('active');
  else el.classList.remove('active');
}
function setParticlesActive(group, active) {
  for(let i=1;i<=3;i++) {
    const el=document.getElementById('p'+group+i);
    if(!el) continue;
    if(active) el.classList.add('active');
    else el.classList.remove('active');
  }
}

function updateUI(data) {
  const g=data.goodwe, a=data.amber;
  document.getElementById('timestamp').textContent=data.timestamp_display||'--';

  const solarW=g.solar_now_w||0, gridW=g.grid_power_w||0;
  const homeW=g.home_consumption_w||0, batW=g.battery_power_w||0;
  const soc=g.battery_soc_pct||0;

  // Data badges
  document.getElementById('svgSolarVal').textContent=fmtW(solarW);
  document.getElementById('svgGridVal').textContent=fmtSignedW(gridW);
  document.getElementById('svgHomeVal').textContent=fmtW(homeW);
  document.getElementById('svgBatVal').textContent=soc+'%';

  // SoC strip
  document.getElementById('socVal').textContent=soc+'%';
  const bar=document.getElementById('socBarFill');
  bar.style.width=soc+'%';
  let bc='#4a9e6e';
  if(soc<15) bc='#c0392b'; else if(soc<30) bc='#c2680c';
  bar.style.background=bc;
  document.getElementById('socMeta').textContent=fmtSignedW(batW)+' · '+(g.battery_flow==='charging'?'charging':g.battery_flow==='discharging'?'discharging':'idle');

  // Flow visibility
  setFlowActive('pathSolarHome', solarW>50);
  setParticlesActive('SH', solarW>50);
  const charging=batW<-50;
  setFlowActive('pathSolarBat', charging&&solarW>100);
  setParticlesActive('SB', charging&&solarW>100);
  setFlowActive('pathBatHome', batW>50);
  setParticlesActive('BH', batW>50);
  setFlowActive('pathGridHome', gridW<-50);
  setParticlesActive('GH', gridW<-50);
  setFlowActive('pathHomeGrid', gridW>50);
  setParticlesActive('HG', gridW>50);

  // Amber
  const price=a.current_price_c;
  document.getElementById('amberPrice').textContent=price!=null?price.toFixed(1):'--';
  const pe=document.getElementById('amberPeriod'), period=a.period||'';
  pe.textContent=period; pe.className='amber-period '+period;
  document.getElementById('amberDescriptor').textContent=a.descriptor||'';
  const ne=document.getElementById('amberNext');
  if(a.next_peak_c!=null&&a.next_peak_time)
    ne.innerHTML='Next peak: <strong>'+a.next_peak_c.toFixed(1)+'c</strong> at '+a.next_peak_time+(a.next_trough_c!=null?' · Trough: <strong>'+a.next_trough_c.toFixed(1)+'c</strong>':'');
  else ne.textContent='';

  // Price bars
  const bars=document.getElementById('priceBars'), fwd=a.forward_prices||[];
  if(fwd.length>0){
    const mx=Math.max(...fwd.map(f=>f.price),0.1);
    bars.innerHTML=fwd.map(f=>{
      let c='#b0ada6';
      if(f.period==='peak') c='#c0392b';
      else if(f.period==='solarSponge') c='#c2680c';
      return '<div class="bar-row"><span class="bar-time">'+f.time+'</span><span class="bar-track"><span class="bar-fill" style="width:'+Math.max((f.price/mx)*100,4)+'%;background:'+c+'"> </span></span><span class="bar-price">'+f.price.toFixed(1)+'c</span></div>';
    }).join('');
  } else bars.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted);font-size:0.8rem">No price data</div>';

  document.getElementById('refreshDot').classList.remove('stale');
  document.getElementById('refreshText').textContent='Live · '+(data.timestamp_short||'just now');
}

function showError(msg){
  document.getElementById('timestamp').textContent='Unable to connect';
  document.getElementById('refreshDot').classList.add('stale');
  document.getElementById('refreshText').textContent=msg||'Connection lost';
}

async function fetchData(){
  try{
    const r=await fetch(DATA_URL+'?v='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    updateUI(await r.json());
  }catch(e){console.warn('Fetch failed:',e.message);showError('Retrying...');}
}

fetchData();
setInterval(fetchData,30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')fetchData();});
</script>
</body>
</html>
