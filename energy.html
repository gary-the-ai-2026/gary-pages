<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Energy · Hancock</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root {
  --canvas: #faf9f5; --surface: #ffffff; --surface-alt: #f5f4f0;
  --ink: #141413; --body: #5c5a55; --muted: #94918a;
  --hairline: #e4e1db;
  --solar: #e8a838; --battery: #4a9e6e; --grid: #5b8cb8; --home: #cc785c;
  --radius: 12px;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--canvas);color:var(--body);-webkit-font-smoothing:antialiased}
.container{max-width:440px;margin:0 auto;padding:14px 12px 32px}

/* Header */
.hero{text-align:center;padding:4px 0 10px}
.hero .kicker{font-size:.6rem;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--home)}
.hero h1{font-family:var(--font-display);font-size:1.4rem;font-weight:900;color:var(--ink)}
.hero .timestamp{font-size:.65rem;color:var(--muted);font-family:var(--font-mono);margin-top:2px}

/* 2×2 power widget grid */
.widget-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.widget{
  background:var(--surface);border:1px solid var(--hairline);
  border-radius:var(--radius);padding:12px 14px;
  display:flex;flex-direction:column;gap:2px
}
.widget .w-label{font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.widget .w-value{font-family:var(--font-display);font-size:1.5rem;font-weight:900;color:var(--ink);line-height:1.1}
.widget .w-sub{font-size:.65rem;color:var(--body);margin-top:1px}
.widget .w-accent{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle}
.widget .w-accent.solar{background:var(--solar)}
.widget .w-accent.battery{background:var(--battery)}
.widget .w-accent.grid{background:var(--grid)}
.widget .w-accent.home{background:var(--home)}

/* Widget border accent */
.widget.solar-w{border-left:3px solid var(--solar)}
.widget.home-w{border-left:3px solid var(--home)}
.widget.grid-w{border-left:3px solid var(--grid)}
.widget.battery-w{border-left:3px solid var(--battery)}

/* Price strip */
.price-strip{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.price-cell{
  background:var(--surface);border:1px solid var(--hairline);
  border-radius:var(--radius);padding:10px 14px;text-align:center
}
.price-cell .pc-label{font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:2px}
.price-cell .pc-val{font-family:var(--font-display);font-size:1.6rem;font-weight:900;color:var(--ink);line-height:1}
.price-cell .pc-unit{font-size:.6rem;font-weight:500;color:var(--muted)}
.price-cell .pc-period{display:inline-block;font-size:.5rem;font-weight:600;text-transform:uppercase;padding:1px 6px;border-radius:100px;margin-top:3px}
.price-cell .pc-period.solarSponge{background:#fef3d5;color:#8b6914}
.price-cell .pc-period.peak{background:#fde8e8;color:#9b1c1c}
.price-cell .pc-period.offPeak{background:#e8f0fe;color:#1e429f}
.price-cell.buy{border-left:3px solid var(--grid)}
.price-cell.sell{border-left:3px solid var(--battery)}

/* Section label */
.section-label{font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:10px 0 6px;padding:0 2px}
.section-label.live{color:#1b8a3d;font-size:.58rem}

/* Daily strip */
.daily-strip{display:flex;justify-content:space-around;gap:8px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius);padding:10px 8px}
.daily-item{text-align:center;flex:1}
.daily-val{font-family:var(--font-display);font-size:1.1rem;font-weight:900;color:var(--ink)}
.daily-lbl{font-size:.5rem;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}

/* Peak/trough */
.info-tag{background:var(--surface);border:1px solid var(--hairline);border-radius:8px;padding:8px 12px;font-size:.65rem;color:var(--body);text-align:center;margin:10px 0}

/* Price bars */
.price-bars{margin:6px 0}
.bar-row{display:flex;align-items:center;gap:6px;padding:3px 0}
.bar-time{width:34px;font-family:var(--font-mono);font-size:.58rem;color:var(--muted);text-align:right;flex-shrink:0}
.bar-track{flex:1;height:14px;background:var(--surface-alt);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .6s ease;display:flex;align-items:center;padding-left:4px;font-size:.5rem;font-weight:600;color:rgba(255,255,255,.85)}
.bar-price{width:38px;font-family:var(--font-mono);font-size:.6rem;font-weight:500;color:var(--body);text-align:left;flex-shrink:0}

/* Chart */
.chart-card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius);padding:14px 10px 8px;margin:10px 0}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.chart-nav{display:flex;align-items:center;gap:10px}
.chart-nav button{background:none;border:1px solid var(--hairline);border-radius:6px;padding:4px 10px;font-size:.6rem;font-family:var(--font-body);font-weight:600;color:var(--body);cursor:pointer}
.chart-nav button:disabled{opacity:.3;cursor:default}
.chart-nav .chart-range{font-size:.62rem;font-weight:600;color:var(--muted);min-width:100px;text-align:center}
.chart-legend{display:flex;gap:14px;font-size:.55rem;color:var(--muted);margin-top:4px}
.chart-legend span{display:flex;align-items:center;gap:4px}
.chart-legend .swatch{width:8px;height:8px;border-radius:2px}
.chart-legend .swatch.renew{background:#4a9e6e}
.chart-legend .swatch.grid{background:#5b8cb8}
#consumptionChart{width:100%;height:auto;max-height:260px}

/* Refresh */
.refresh-bar{display:flex;align-items:center;justify-content:center;gap:5px;padding:10px;font-size:.58rem;color:var(--muted)}
.refresh-dot{width:5px;height:5px;border-radius:50%;background:#1b8a3d}
.refresh-dot.stale{background:#c2680c}
</style>
</head>
<body>
<div class="container">
  <div class="hero">
    <div class="kicker">119 Princes Road</div>
    <h1>Energy</h1>
    <div class="timestamp" id="timestamp">--</div>
  </div>

  <!-- LIVE section -->
  <div class="section-label">● LIVE</div>

  <!-- 2×2 power widgets -->
  <div class="widget-grid">
    <div class="widget solar-w">
      <div class="w-label"><span class="w-accent solar"></span>Solar</div>
      <div class="w-value" id="wSolar">--</div>
      <div class="w-sub" id="wSolarSub">--</div>
    </div>
    <div class="widget home-w">
      <div class="w-label"><span class="w-accent home"></span>Home</div>
      <div class="w-value" id="wHome">--</div>
      <div class="w-sub">consumption</div>
    </div>
    <div class="widget grid-w">
      <div class="w-label"><span class="w-accent grid"></span>Grid</div>
      <div class="w-value" id="wGrid">--</div>
      <div class="w-sub" id="wGridSub">--</div>
    </div>
    <div class="widget battery-w">
      <div class="w-label"><span class="w-accent battery"></span>Battery</div>
      <div class="w-value" id="wBat">--</div>
      <div class="w-sub" id="wBatSub">--</div>
    </div>
  </div>

  <!-- Amber prices -->
  <div class="price-strip">
    <div class="price-cell buy">
      <div class="pc-label">Buy Price</div>
      <div class="pc-val" id="buyPrice">--</div>
      <div class="pc-unit">c/kWh</div>
      <div class="pc-period" id="buyPeriod">--</div>
    </div>
    <div class="price-cell sell">
      <div class="pc-label">Sell Price</div>
      <div class="pc-val" id="sellPrice">--</div>
      <div class="pc-unit">c/kWh</div>
      <div class="pc-period" id="sellPeriod">--</div>
    </div>
  </div>

  <!-- Peak/trough -->
  <div class="info-tag" id="peakInfo">--</div>

  <!-- Daily -->
  <div class="section-label">Today</div>
  <div class="daily-strip">
    <div class="daily-item"><div class="daily-val" id="dailySolar">--</div><div class="daily-lbl">Generated</div></div>
    <div class="daily-item"><div class="daily-val" id="dailyBatt">--</div><div class="daily-lbl">Battery</div></div>
    <div class="daily-item"><div class="daily-val" id="dailyExport">--</div><div class="daily-lbl">To Grid</div></div>
  </div>

  <!-- Consumption chart -->
  <div class="section-label">Consumption Mix</div>
  <div class="chart-card">
    <div class="chart-header">
      <div class="section-label" style="margin:0">Last 7 Days</div>
      <div class="chart-nav">
        <button id="chartPrev" disabled>← Newer</button>
        <span class="chart-range" id="chartRange">--</span>
        <button id="chartNext" disabled>Older →</button>
      </div>
    </div>
    <canvas id="consumptionChart"></canvas>
    <div class="chart-legend">
      <span><span class="swatch renew"></span> Solar + Battery</span>
      <span><span class="swatch grid"></span> Grid Import</span>
    </div>
  </div>

  <!-- Forward prices -->
  <div class="section-label">Next 4 Hours</div>
  <div class="price-bars" id="priceBars"></div>

  <div class="refresh-bar"><div class="refresh-dot" id="refreshDot"></div><span id="refreshText">Loading...</span></div>
</div>

<script>
const DATA_URL='data/energy-data.json';

function fmtW(v){const a=Math.abs(v);return a>=1000?(a/1000).toFixed(2)+' kW':Math.round(a)+' W'}
function fmtKwh(v){return v==null?'--':v.toFixed(1)+' kWh'}

function setText(id,val){const el=document.getElementById(id);if(el&&el.textContent!==val)el.textContent=val}

function updateUI(data){
  const g=data.goodwe,a=data.amber;
  setText('timestamp',data.timestamp_display||'--');

  const sW=g.solar_now_w||0,gW=g.grid_power_w||0,hW=g.home_consumption_w||0,bW=g.battery_power_w||0,soc=g.battery_soc_pct||0;

  // Widgets
  setText('wSolar',fmtW(sW));
  setText('wSolarSub',(g.today_solar_kwh||0).toFixed(1)+' kWh today');

  setText('wHome',fmtW(hW));

  const ga=Math.abs(gW),gd=gW<-50?'importing':gW>50?'exporting':'idle';
  setText('wGrid',fmtW(ga));
  setText('wGridSub',gd);

  setText('wBat',soc+'%');
  const storedKwh=(soc*0.32).toFixed(1);
  const ba=Math.abs(bW);
  const bs=bW>50?'discharging '+fmtW(ba):bW<-50?'charging '+fmtW(ba):'idle';
  setText('wBatSub',storedKwh+' kWh · '+bs);

  // Amber prices
  const buyC=a.current_price_c,sellC=a.sell_price_c,period=a.period||'';
  if(buyC!=null){
    setText('buyPrice',buyC.toFixed(1));
    const bp=document.getElementById('buyPeriod');bp.textContent=period;bp.className='pc-period '+period;
  }
  if(sellC!=null){
    setText('sellPrice',sellC.toFixed(1));
    const sp=document.getElementById('sellPeriod');sp.textContent=period;sp.className='pc-period '+period;
  }

  // Peak/trough
  const pi=document.getElementById('peakInfo');
  if(a.next_peak_c!=null&&a.next_peak_time)
    pi.innerHTML='Next peak <strong>'+a.next_peak_c.toFixed(1)+'c</strong> at '+a.next_peak_time+
      (a.next_trough_c!=null?' &nbsp;·&nbsp; Trough <strong>'+a.next_trough_c.toFixed(1)+'c</strong> at '+a.next_trough_time:'');
  else pi.textContent='';

  // Daily
  setText('dailySolar',fmtKwh(g.today_solar_kwh));
  setText('dailyBatt',fmtKwh(g.lifetime_bat_charge_kwh));
  setText('dailyExport',fmtKwh(g.lifetime_export_kwh));

  // Forward price bars
  const bars=document.getElementById('priceBars'),fwd=a.forward_prices||[];
  if(fwd.length>0){
    const mx=Math.max(...fwd.map(f=>f.price),.1);
    bars.innerHTML=fwd.map(f=>{
      let c='#b0ada6';if(f.period==='peak')c='#c0392b';else if(f.period==='solarSponge')c='#c2680c';
      return '<div class="bar-row"><span class="bar-time">'+f.time+'</span><span class="bar-track"><span class="bar-fill" style="width:'+Math.max((f.price/mx)*100,4)+'%;background:'+c+'"> </span></span><span class="bar-price">'+f.price.toFixed(1)+'c</span></div>';
    }).join('');
  }else bars.innerHTML='<div style="padding:12px;text-align:center;color:var(--muted);font-size:.65rem">No price data</div>';

  const dot=document.getElementById('refreshDot');dot.classList.remove('stale');
  setText('refreshText','Live · '+(data.timestamp_short||'just now'));
}

function showError(msg){
  setText('timestamp','Unable to connect');
  document.getElementById('refreshDot').classList.add('stale');
  setText('refreshText',msg||'Connection lost');
}

async function fetchData(){
  try{const r=await fetch(DATA_URL+'?v='+Date.now());if(!r.ok)throw new Error('HTTP '+r.status);updateUI(await r.json())}
  catch(e){console.warn(e.message);showError('Retrying...')}
}
fetchData();setInterval(fetchData,30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')fetchData()});

// === CONSUMPTION CHART ===
const HISTORY_URL='data/energy-history.json';
let allHistory=[],chartOffset=0,chartInstance=null;
const DAYS_PER_PAGE=7;

function fmtDate(d){const p=d.split('-');return p[2]+'/'+p[1]}

async function loadHistory(){
  try{const r=await fetch(HISTORY_URL+'?v='+Date.now());if(r.ok)allHistory=await r.json();else allHistory=[]}
  catch(e){allHistory=[]}
  renderChart();
}

function renderChart(){
  const totalDays=allHistory.length;
  if(totalDays===0){
    document.getElementById('chartRange').textContent='No data yet';
    document.getElementById('chartPrev').disabled=true;
    document.getElementById('chartNext').disabled=true;
    if(chartInstance){chartInstance.destroy();chartInstance=null}
    return;
  }
  // Clamp offset
  if(chartOffset<0)chartOffset=0;
  if(chartOffset+DAYS_PER_PAGE>totalDays)chartOffset=Math.max(0,totalDays-DAYS_PER_PAGE);

  const page=allHistory.slice(chartOffset,chartOffset+DAYS_PER_PAGE).reverse(); // oldest first for chart
  const labels=page.map(d=>fmtDate(d.date));
  const renewData=page.map(d=>(d.solar_kwh||0)+(d.battery_discharge_kwh||0));
  const gridData=page.map(d=>d.grid_import_kwh||0);

  // Update nav
  const end=chartOffset+page.length;
  document.getElementById('chartRange').textContent=labels[0]+' – '+labels[labels.length-1];
  document.getElementById('chartPrev').disabled=chartOffset===0;
  document.getElementById('chartNext').disabled=chartOffset+DAYS_PER_PAGE>=totalDays;

  // Render
  const ctx=document.getElementById('consumptionChart').getContext('2d');
  if(chartInstance)chartInstance.destroy();
  chartInstance=new Chart(ctx,{
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'Solar + Battery',data:renewData,backgroundColor:'#4a9e6e',borderRadius:4,borderSkipped:false},
        {label:'Grid Import',data:gridData,backgroundColor:'#5b8cb8',borderRadius:4,borderSkipped:false},
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:true,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+ctx.raw.toFixed(1)+' kWh'}}},
      scales:{
        x:{stacked:true,grid:{display:false},ticks:{font:{size:9},color:'#94918a'}},
        y:{stacked:true,grid:{color:'#e4e1db'},ticks:{font:{size:9},color:'#94918a',callback:v=>v+' kWh'},title:{display:true,text:'kWh',font:{size:9},color:'#94918a'}}
      }
    }
  });
}

document.getElementById('chartPrev').addEventListener('click',()=>{chartOffset=Math.max(0,chartOffset-DAYS_PER_PAGE);renderChart()});
document.getElementById('chartNext').addEventListener('click',()=>{chartOffset+=DAYS_PER_PAGE;renderChart()});

loadHistory();
</script>
</body>
</html>
