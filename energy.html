<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Energy · Hancock</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700;900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --canvas: #faf9f5; --surface: #ffffff; --surface-alt: #f0eeea;
  --ink: #141413; --body: #5c5a55; --muted: #94918a;
  --hairline: #e4e1db; --coral: #cc785c;
  --solar: #e8a838; --solar-light: #fef9f0; --solar-soft: #f5d080;
  --battery: #4a9e6e; --battery-light: #f0faf4; --battery-soft: #8cd4a0;
  --grid: #5b8cb8; --grid-light: #f0f5fa; --grid-soft: #a0c4e0;
  --home: #cc785c; --home-light: #fdf5f2; --home-soft: #e8b8a8;
  --export: #c0392b;
  --radius: 16px; --radius-sm: 10px;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--canvas);color:var(--body);-webkit-font-smoothing:antialiased}
.container{max-width:480px;margin:0 auto;padding:12px 10px 32px}

/* Header */
.hero{text-align:center;padding:6px 0 2px}
.hero .kicker{font-size:.62rem;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--coral)}
.hero h1{font-family:var(--font-display);font-size:1.5rem;font-weight:900;color:var(--ink)}
.hero .timestamp{font-size:.68rem;color:var(--muted);font-family:var(--font-mono);margin-top:1px}

/* === FLOW DIAGRAM === */
.flow-section{display:flex;flex-direction:column;align-items:center;gap:0;margin:12px 0;position:relative}

/* Node cards */
.node-card{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--surface);border:2px solid var(--hairline);
  border-radius:var(--radius);width:100%;max-width:280px;
  position:relative;transition:border-color .3s
}
.node-card .nc-icon{width:42px;height:42px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.node-card .nc-icon svg{width:24px;height:24px}
.node-card .nc-info{flex:1;min-width:0}
.node-card .nc-val{font-family:var(--font-display);font-size:1.25rem;font-weight:900;color:var(--ink);line-height:1.1}
.node-card .nc-sub{font-size:.68rem;color:var(--body)}
.node-card .nc-label{font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}

/* Node variants */
.node-card.solar{border-color:var(--solar-soft)}
.node-card.solar .nc-icon{background:var(--solar-light)}
.node-card.solar .nc-val{color:var(--solar)}
.node-card.grid-node{border-color:var(--grid-soft)}
.node-card.grid-node .nc-icon{background:var(--grid-light)}
.node-card.grid-node .nc-val{color:var(--grid)}
.node-card.home-node{border-color:var(--home-soft);border-width:2.5px;max-width:300px}
.node-card.home-node .nc-icon{background:var(--home-light);width:48px;height:48px}
.node-card.home-node .nc-icon svg{width:28px;height:28px}
.node-card.home-node .nc-val{font-size:1.5rem}
.node-card.battery-node{border-color:var(--battery-soft)}
.node-card.battery-node .nc-icon{background:var(--battery-light)}
.node-card.battery-node .nc-val{color:var(--battery)}

/* Connection indicators between cards */
.connector{
  display:flex;align-items:center;justify-content:center;width:2px;height:18px;
  position:relative;margin:1px 0
}
.connector::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  border-left:2px dashed var(--hairline)
}
.connector.active::before{border-color:var(--solar);border-style:solid}
.connector .dot{
  width:4px;height:4px;border-radius:50%;position:absolute;
  animation:moveDown 1.2s linear infinite
}
.connector .dot:nth-child(2){animation-delay:.4s}
.connector .dot:nth-child(3){animation-delay:.8s}
.connector.solar-dot .dot{background:var(--solar)}
.connector.grid-dot .dot{background:var(--grid)}
.connector.battery-dot .dot{background:var(--battery)}

@keyframes moveDown{0%{top:0;opacity:1}80%{opacity:1}100%{top:100%;opacity:0}}

/* Split connector for grid+battery below home */
.split-connector{
  display:flex;justify-content:center;gap:40px;width:100%;max-width:280px;
  position:relative;margin:1px 0
}
.split-connector::before{
  content:'';position:absolute;top:0;left:50%;width:40%;height:18px;
  border-left:2px dashed var(--hairline);
  border-bottom:2px dashed var(--hairline);
  border-radius:0 0 0 8px
}
.split-connector::after{
  content:'';position:absolute;top:0;right:50%;width:40%;height:18px;
  border-right:2px dashed var(--hairline);
  border-bottom:2px dashed var(--hairline);
  border-radius:0 0 8px 0
}
.split-branch{display:flex;align-items:center;justify-content:center;width:2px;position:relative}
.split-branch::before{content:'';position:absolute;top:18px;left:0;width:100%;height:12px;border-left:2px dashed var(--hairline)}
.split-branch .dot{width:4px;height:4px;border-radius:50%;position:absolute;top:18px;animation:moveDown 1.2s linear infinite}
.split-branch .dot:nth-child(2){animation-delay:.4s}
.split-branch .dot:nth-child(3){animation-delay:.8s}
.split-branch.left .dot{background:var(--grid)}
.split-branch.right .dot{background:var(--battery)}

/* Row for grid+battery side by side */
.flow-row{display:flex;gap:10px;width:100%;max-width:280px;justify-content:center}
.flow-row .node-card{flex:1;max-width:135px;padding:8px 10px;flex-direction:column;align-items:center;text-align:center;gap:4px}
.flow-row .nc-val{font-size:1rem}
.flow-row .nc-icon{width:32px;height:32px}
.flow-row .nc-icon svg{width:18px;height:18px}

/* === AMBER PRICE STRIP === */
.price-strip{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.price-cell{
  background:var(--surface);border:1px solid var(--hairline);
  border-radius:var(--radius-sm);padding:10px 12px;text-align:center
}
.price-cell .pc-label{font-size:.58rem;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:2px}
.price-cell .pc-val{font-family:var(--font-display);font-size:1.6rem;font-weight:900;color:var(--ink);line-height:1}
.price-cell .pc-unit{font-size:.65rem;font-weight:500;color:var(--muted)}
.price-cell .pc-period{display:inline-block;font-size:.55rem;font-weight:600;text-transform:uppercase;padding:1px 6px;border-radius:100px;margin-top:3px}
.price-cell .pc-period.solarSponge{background:#fef3d5;color:#8b6914}
.price-cell .pc-period.peak{background:#fde8e8;color:#9b1c1c}
.price-cell .pc-period.offPeak{background:#e8f0fe;color:#1e429f}
.price-cell.buy{border-color:rgba(91,140,184,.3)}
.price-cell.sell{border-color:rgba(74,158,110,.3)}

/* Explainer & daily */
.explainer{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:8px 12px;margin:10px 0;font-size:.72rem;color:var(--body);line-height:1.5;text-align:center}
.daily-strip{display:flex;justify-content:center;gap:16px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:8px 12px;margin:10px 0}
.daily-item{text-align:center}
.daily-val{font-family:var(--font-display);font-size:.95rem;font-weight:900;color:var(--ink)}
.daily-lbl{font-size:.55rem;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}

/* Price bars */
.price-bars{margin:10px 0}
.price-bars-label{font-size:.58rem;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.bar-row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:.68rem}
.bar-time{width:36px;font-family:var(--font-mono);font-size:.62rem;color:var(--muted);text-align:right;flex-shrink:0}
.bar-track{flex:1;height:18px;background:var(--surface-alt);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .6s ease;display:flex;align-items:center;padding-left:4px;font-size:.58rem;font-weight:600;color:rgba(255,255,255,.9);white-space:nowrap}
.bar-price{width:42px;font-family:var(--font-mono);font-size:.65rem;font-weight:500;color:var(--body);text-align:left;flex-shrink:0}

.refresh-bar{display:flex;align-items:center;justify-content:center;gap:4px;padding:8px;font-size:.6rem;color:var(--muted)}
.refresh-dot{width:5px;height:5px;border-radius:50%;background:#1b8a3d}
.refresh-dot.stale{background:#c2680c}
</style>
</head>
<body>
<div class="container">
  <div class="hero">
    <div class="kicker">119 Princes Road</div>
    <h1>Energy</h1>
    <div class="timestamp" id="timestamp">--</div>
  </div>

  <!-- FLOW DIAGRAM — themed node cards with inline SVG icons -->
  <div class="flow-section">

    <!-- SOLAR -->
    <div class="node-card solar" id="cardSolar">
      <div class="nc-icon">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="12" width="18" height="9" rx="1" fill="#e8a838" opacity=".2" stroke="#e8a838" stroke-width="1"/><line x1="6" y1="15" x2="18" y2="15" stroke="#e8a838" stroke-width=".5"/><line x1="6" y1="18" x2="18" y2="18" stroke="#e8a838" stroke-width=".5"/><circle cx="12" cy="7" r="3" fill="#e8a838"/><line x1="12" y1="1" x2="12" y2="4" stroke="#e8a838" stroke-width="1.5" stroke-linecap="round"/><line x1="7" y1="3" x2="9" y2="5" stroke="#e8a838" stroke-width="1" stroke-linecap="round"/><line x1="17" y1="3" x2="15" y2="5" stroke="#e8a838" stroke-width="1" stroke-linecap="round"/></svg>
      </div>
      <div class="nc-info">
        <div class="nc-val" id="nvSolar">--</div>
        <div class="nc-label">Solar</div>
      </div>
    </div>

    <!-- Connector: Solar → Home -->
    <div class="connector solar-dot" id="connSolar"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

    <!-- HOME -->
    <div class="node-card home-node" id="cardHome">
      <div class="nc-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 12L12 3l9 9" stroke="#cc785c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v11h5v-6h4v6h5V10" fill="#cc785c" opacity=".15" stroke="#cc785c" stroke-width="1.2" stroke-linejoin="round"/><rect x="10" y="15" width="4" height="6" rx=".5" fill="#fdf5f2" stroke="#cc785c" stroke-width=".8"/></svg>
      </div>
      <div class="nc-info">
        <div class="nc-val" id="nvHome">--</div>
        <div class="nc-label">Home</div>
      </div>
    </div>

    <!-- Split connector: Home → Grid + Battery -->
    <div class="split-connector" id="splitConn">
      <div class="split-branch left">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
      <div class="split-branch right">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>

    <!-- GRID + BATTERY side by side -->
    <div class="flow-row">
      <div class="node-card grid-node" id="cardGrid">
        <div class="nc-icon">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="1" width="2.5" height="22" rx="1" fill="#5b8cb8" opacity=".15"/><rect x="18.5" y="1" width="2.5" height="22" rx="1" fill="#5b8cb8" opacity=".15"/><line x1="1" y1="7" x2="23" y2="7" stroke="#5b8cb8" stroke-width=".8"/><line x1="1" y1="14" x2="23" y2="14" stroke="#5b8cb8" stroke-width=".8"/><line x1="4" y1="4" x2="20" y2="4" stroke="#5b8cb8" stroke-width=".5"/><line x1="4" y1="10" x2="20" y2="10" stroke="#5b8cb8" stroke-width=".5"/><line x1="4" y1="17" x2="20" y2="17" stroke="#5b8cb8" stroke-width=".5"/></svg>
        </div>
        <div class="nc-info">
          <div class="nc-val" id="nvGrid">--</div>
          <div class="nc-label">Grid</div>
        </div>
      </div>
      <div class="node-card battery-node" id="cardBatt">
        <div class="nc-icon">
          <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="18" height="15" rx="2" fill="#4a9e6e" opacity=".15" stroke="#4a9e6e" stroke-width="1.2"/><rect x="7" y="2" width="8" height="4" rx="1" fill="none" stroke="#4a9e6e" stroke-width="1"/><rect x="5" y="9" width="4" height="9" rx=".5" fill="#4a9e6e" opacity=".4"/><rect x="10" y="9" width="4" height="9" rx=".5" fill="#4a9e6e" opacity=".3"/><rect x="15" y="9" width="2" height="9" rx=".5" fill="#4a9e6e" opacity=".15"/></svg>
        </div>
        <div class="nc-info">
          <div class="nc-val" id="nvBat">--</div>
          <div class="nc-sub" id="nvBatSub">--</div>
          <div class="nc-label">Battery</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Amber buy/sell prices -->
  <div class="price-strip">
    <div class="price-cell buy">
      <div class="pc-label">Buy at</div>
      <div class="pc-val" id="buyPrice">--</div>
      <div class="pc-unit">c/kWh</div>
      <div class="pc-period" id="buyPeriod">--</div>
    </div>
    <div class="price-cell sell">
      <div class="pc-label">Sell at</div>
      <div class="pc-val" id="sellPrice">--</div>
      <div class="pc-unit">c/kWh</div>
      <div class="pc-period" id="sellPeriod">--</div>
    </div>
  </div>

  <!-- Explainer -->
  <div class="explainer" id="explainer">--</div>

  <!-- Daily totals -->
  <div class="daily-strip">
    <div class="daily-item"><div class="daily-val" id="dailySolar">--</div><div class="daily-lbl">Generated</div></div>
    <div class="daily-item"><div class="daily-val" id="dailyBatt">--</div><div class="daily-lbl">Battery</div></div>
    <div class="daily-item"><div class="daily-val" id="dailyExport">--</div><div class="daily-lbl">To Grid</div></div>
  </div>

  <!-- Next peak/trough -->
  <div class="explainer" id="peakInfo" style="font-size:.68rem">--</div>

  <!-- Forward Prices -->
  <div class="price-bars">
    <div class="price-bars-label">Next 4 Hours</div>
    <div id="priceBars"></div>
  </div>

  <div class="refresh-bar"><div class="refresh-dot" id="refreshDot"></div><span id="refreshText">Loading...</span></div>
</div>

<script>
const DATA_URL='data/energy-data.json';

function fmtW(v){const a=Math.abs(v);return a>=1000?(a/1000).toFixed(2)+' kW':Math.round(a)+' W'}
function fmtKwh(v){return v==null?'--':v.toFixed(1)+' kWh'}

function setActive(el,active){if(active)el.classList.add('active');else el.classList.remove('active')}

function updateConnectorDots(connId,active){
  const conn=document.getElementById(connId);
  if(!conn)return;
  conn.querySelectorAll('.dot').forEach(d=>{d.style.display=active?'block':'none'});
}

function updateUI(data){
  const g=data.goodwe,a=data.amber;
  document.getElementById('timestamp').textContent=data.timestamp_display||'--';

  const sW=g.solar_now_w||0, gW=g.grid_power_w||0;
  const hW=g.home_consumption_w||0, bW=g.battery_power_w||0;
  const soc=g.battery_soc_pct||0;

  // Node values
  document.getElementById('nvSolar').textContent=fmtW(sW);
  const ga=Math.abs(gW),gd=gW<-50?' ↓':gW>50?' ↑':'';
  document.getElementById('nvGrid').textContent=fmtW(ga)+gd;
  document.getElementById('nvHome').textContent=fmtW(hW);
  document.getElementById('nvBat').textContent=fmtW(Math.abs(bW));
  document.getElementById('nvBatSub').textContent=soc+'%'+(g.battery_flow?', '+g.battery_flow:'');

  // Connection dots — show when flow is active
  const chg=bW<-50, dis=bW>50, imp=gW<-50, exp=gW>50;
  updateConnectorDots('connSolar',sW>50);
  // Grid dot always shown if importing, battery dot if charging/discharging
  const splitConn=document.getElementById('splitConn');
  const lDots=splitConn.querySelectorAll('.split-branch.left .dot');
  const rDots=splitConn.querySelectorAll('.split-branch.right .dot');
  lDots.forEach(d=>d.style.display=imp||exp?'block':'none');
  rDots.forEach(d=>d.style.display=(chg||dis)?'block':'none');

  // Node card borders glow on activity
  setActive(document.getElementById('cardSolar'),sW>50);
  setActive(document.getElementById('cardGrid'),imp||exp);
  setActive(document.getElementById('cardBatt'),chg||dis);

  // Daily
  document.getElementById('dailySolar').textContent=fmtKwh(g.today_solar_kwh);
  document.getElementById('dailyBatt').textContent=fmtKwh(g.lifetime_bat_charge_kwh);
  document.getElementById('dailyExport').textContent=fmtKwh(g.lifetime_export_kwh);

  // Amber prices — buy = perKwh (retail), sell = spotPerKwh (wholesale feed-in)
  const buyC=a.current_price_c, sellC=a.sell_price_c;
  const period=a.period||'';
  if(buyC!=null){
    document.getElementById('buyPrice').textContent=buyC.toFixed(1);
    const bp=document.getElementById('buyPeriod');
    bp.textContent=period;bp.className='pc-period '+period;
  }
  if(sellC!=null){
    document.getElementById('sellPrice').textContent=sellC.toFixed(1);
    const sp=document.getElementById('sellPeriod');
    sp.textContent=period;sp.className='pc-period '+period;
  }

  // Explainer
  let parts=[];
  if(sW>20) parts.push('<strong>Solar</strong> '+fmtW(sW));
  if(hW>20) parts.push('<strong>Home</strong> '+fmtW(hW));
  if(chg) parts.push('<strong>Battery</strong> charging '+fmtW(Math.abs(bW))+' ('+soc+'%)');
  if(dis) parts.push('<strong>Battery</strong> discharging '+fmtW(bW)+' ('+soc+'%)');
  if(imp) parts.push('<strong>Grid</strong> importing '+fmtW(Math.abs(gW))+' at '+(buyC||'?')+'c');
  if(exp) parts.push('<strong>Grid</strong> exporting '+fmtW(gW)+' at '+(sellC||'?')+'c');
  document.getElementById('explainer').innerHTML=parts.length?parts.join(' · '):'Waiting for data...';

  // Peak/trough
  const pi=document.getElementById('peakInfo');
  if(a.next_peak_c!=null&&a.next_peak_time)
    pi.innerHTML='Next peak: <strong>'+a.next_peak_c.toFixed(1)+'c</strong> at '+a.next_peak_time+
      (a.next_trough_c!=null?' · Trough: <strong>'+a.next_trough_c.toFixed(1)+'c</strong> at '+a.next_trough_time:'');
  else pi.textContent='';

  // Price bars
  const bars=document.getElementById('priceBars'),fwd=a.forward_prices||[];
  if(fwd.length>0){
    const mx=Math.max(...fwd.map(f=>f.price),.1);
    bars.innerHTML=fwd.map(f=>{
      let c='#b0ada6';if(f.period==='peak')c='#c0392b';else if(f.period==='solarSponge')c='#c2680c';
      return '<div class="bar-row"><span class="bar-time">'+f.time+'</span><span class="bar-track"><span class="bar-fill" style="width:'+Math.max((f.price/mx)*100,4)+'%;background:'+c+'"> </span></span><span class="bar-price">'+f.price.toFixed(1)+'c</span></div>';
    }).join('');
  }else bars.innerHTML='<div style="padding:16px;text-align:center;color:var(--muted);font-size:.7rem">No price data</div>';

  // Refresh indicator
  const dot=document.getElementById('refreshDot');dot.classList.remove('stale');
  document.getElementById('refreshText').textContent='Live · '+(data.timestamp_short||'just now');
}

function showError(msg){
  document.getElementById('timestamp').textContent='Unable to connect';
  document.getElementById('refreshDot').classList.add('stale');
  document.getElementById('refreshText').textContent=msg||'Connection lost';
}

async function fetchData(){
  try{const r=await fetch(DATA_URL+'?v='+Date.now());if(!r.ok)throw new Error('HTTP '+r.status);updateUI(await r.json())}
  catch(e){console.warn(e.message);showError('Retrying...')}
}
fetchData();setInterval(fetchData,30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')fetchData()});
</script>
</body>
</html>
