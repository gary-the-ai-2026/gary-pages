<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Energy · Hancock</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700;900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --canvas: #faf9f5;
  --surface: #ffffff;
  --surface-alt: #f0eeea;
  --ink: #141413;
  --body: #5c5a55;
  --muted: #94918a;
  --hairline: #e4e1db;
  --hairline-soft: #ece9e4;
  --coral: #cc785c;
  --coral-hover: #a9583e;
  --success: #1b8a3d;
  --warning: #c2680c;
  --danger: #c0392b;
  --solar: #e8a838;
  --battery: #4a9e6e;
  --grid: #5b8cb8;
  --home: #cc785c;
  --radius: 20px;
  --radius-sm: 12px;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background: var(--canvas);
  color: var(--body);
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }

/* Hero */
.hero {
  text-align: center; padding: 10px 0 4px;
}
.hero .kicker {
  font-size: 0.7rem; font-weight: 600; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--coral);
}
.hero h1 {
  font-family: var(--font-display); font-size: 2rem; font-weight: 900;
  color: var(--ink); letter-spacing: -0.5px; margin: 2px 0 0;
}
.hero .timestamp {
  font-size: 0.78rem; color: var(--muted);
  font-family: var(--font-mono);
  margin-top: 2px;
}

/* Battery Ring */
.battery-card {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  padding: 24px 20px 20px;
  text-align: center;
  margin: 16px 0;
  position: relative;
}
.battery-ring-wrap {
  position: relative; display: inline-block;
}
.battery-ring-wrap svg { display: block; }
.battery-soc {
  position: absolute; inset: 0; display: flex;
  flex-direction: column; align-items: center; justify-content: center;
}
.battery-soc-value {
  font-family: var(--font-display);
  font-size: 3.5rem; font-weight: 900;
  line-height: 1; color: var(--ink);
  transition: all 0.5s ease;
}
.battery-soc-label {
  font-size: 0.72rem; font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase; color: var(--muted);
  margin-top: 2px;
}
.battery-flow {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 14px; border-radius: 100px;
  font-size: 0.78rem; font-weight: 600;
  margin-top: 6px;
}
.battery-flow.charging { background: #e8f5e0; color: #2d6a3f; }
.battery-flow.discharging { background: #fef0e0; color: #a9583e; }
.battery-flow.idle { background: var(--surface-alt); color: var(--muted); }
.battery-info {
  display: flex; justify-content: center; gap: 24px;
  margin-top: 10px; font-size: 0.75rem; color: var(--muted);
}
.battery-info span { display: flex; align-items: center; gap: 4px; }

/* Power Flow */
.flow-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 10px; margin: 16px 0;
}
.flow-node {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius-sm); padding: 14px 8px;
  text-align: center; cursor: default;
  transition: border-color 0.3s;
}
.flow-node .node-icon { font-size: 1.6rem; margin-bottom: 4px; }
.flow-node .node-value {
  font-family: var(--font-display); font-size: 1.4rem;
  font-weight: 900; color: var(--ink); line-height: 1.1;
}
.flow-node .node-label {
  font-size: 0.65rem; font-weight: 500; text-transform: uppercase;
  letter-spacing: 0.5px; color: var(--muted); margin-top: 2px;
}
.flow-node .node-detail {
  font-size: 0.7rem; color: var(--muted); margin-top: 1px;
}
.flow-node.highlight-solar { border-color: var(--solar); }
.flow-node.highlight-battery { border-color: var(--battery); }
.flow-node.highlight-home { border-color: var(--coral); }
.flow-node.highlight-grid { border-color: var(--grid); }

/* Amber Price Card */
.amber-card {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 16px 18px;
  display: flex; align-items: center; gap: 14px;
  margin: 16px 0;
}
.amber-price {
  font-family: var(--font-display); font-size: 2.2rem; font-weight: 900;
  color: var(--ink); line-height: 1;
}
.amber-price-unit {
  font-size: 0.85rem; font-weight: 600; color: var(--muted);
}
.amber-meta { flex: 1; }
.amber-period {
  font-size: 0.7rem; font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase; padding: 3px 10px; border-radius: 100px;
  display: inline-block; margin-bottom: 4px;
}
.amber-period.solarSponge { background: #fef3d5; color: #8b6914; }
.amber-period.peak { background: #fde8e8; color: #9b1c1c; }
.amber-period.offPeak { background: #e8f0fe; color: #1e429f; }
.amber-descriptor { font-size: 0.78rem; color: var(--body); }
.amber-next {
  font-size: 0.75rem; color: var(--muted); margin-top: 2px;
}
.amber-next strong { color: var(--ink); }

/* Price Bars */
.price-bars {
  margin: 16px 0;
}
.price-bars-label {
  font-size: 0.68rem; font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
}
.bar-row {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 0; font-size: 0.75rem;
}
.bar-time {
  width: 42px; font-family: var(--font-mono);
  font-size: 0.7rem; color: var(--muted); text-align: right; flex-shrink: 0;
}
.bar-track {
  flex: 1; height: 22px; background: var(--surface-alt);
  border-radius: 4px; overflow: hidden; position: relative;
}
.bar-fill {
  height: 100%; border-radius: 4px; transition: width 0.8s ease;
  display: flex; align-items: center; padding-left: 6px;
  font-size: 0.68rem; font-weight: 600; color: rgba(255,255,255,0.9);
  white-space: nowrap;
}
.bar-price {
  width: 52px; font-family: var(--font-mono);
  font-size: 0.72rem; font-weight: 500; color: var(--body);
  text-align: left; flex-shrink: 0;
}

/* Refresh indicator */
.refresh-bar {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; padding: 10px; font-size: 0.7rem; color: var(--muted);
}
.refresh-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--success);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
.refresh-dot.stale { background: var(--warning); }

/* Error / connecting state */
.error-state {
  text-align: center; padding: 40px 20px;
}
.error-state .error-icon { font-size: 2.5rem; margin-bottom: 10px; }
.error-state .error-title {
  font-family: var(--font-display); font-size: 1.3rem;
  font-weight: 700; color: var(--ink);
}
.error-state .error-text {
  font-size: 0.85rem; color: var(--muted); margin-top: 4px;
}

/* Loading shimmer */
@keyframes shimmer {
  0% { background-position: -200px 0; }
  100% { background-position: calc(200px + 100%) 0; }
}
.shimmer {
  background: linear-gradient(90deg, var(--surface-alt) 25%, var(--hairline) 50%, var(--surface-alt) 75%);
  background-size: 200px 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 4px;
}

/* Mobile */
@media (max-width: 480px) {
  .flow-grid { grid-template-columns: repeat(2, 1fr); }
  .hero h1 { font-size: 1.6rem; }
  .battery-soc-value { font-size: 2.8rem; }
  .amber-price { font-size: 1.8rem; }
}
</style>
</head>
<body>
<div class="container">

  <!-- Hero -->
  <div class="hero">
    <div class="kicker">119 Princes Road</div>
    <h1>Energy</h1>
    <div class="timestamp" id="timestamp">--</div>
  </div>

  <!-- Battery -->
  <div class="battery-card" id="batteryCard">
    <div class="battery-ring-wrap">
      <svg width="180" height="180" viewBox="0 0 180 180">
        <circle cx="90" cy="90" r="78" fill="none" stroke="#f0eeea" stroke-width="10"/>
        <circle id="batteryArc" cx="90" cy="90" r="78" fill="none" stroke="#4a9e6e" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="0 490" transform="rotate(-90 90 90)"
          style="transition: stroke-dasharray 1s ease, stroke 0.5s ease;"/>
      </svg>
      <div class="battery-soc">
        <div class="battery-soc-value" id="socValue">--</div>
        <div class="battery-soc-label">% charged</div>
      </div>
    </div>
    <div class="battery-flow idle" id="batteryFlow">--</div>
    <div class="battery-info">
      <span>🔋 <span id="batteryPower">--</span></span>
      <span>🌡️ <span id="batteryTemp">--</span></span>
      <span>❤️ <span id="batteryHealth">--</span></span>
    </div>
  </div>

  <!-- Power Flow -->
  <div class="flow-grid">
    <div class="flow-node highlight-solar">
      <div class="node-icon">☀️</div>
      <div class="node-value" id="solarVal">--</div>
      <div class="node-label">Solar</div>
      <div class="node-detail" id="solarDetail">--</div>
    </div>
    <div class="flow-node highlight-battery">
      <div class="node-icon">🔋</div>
      <div class="node-value" id="batVal">--</div>
      <div class="node-label">Battery</div>
      <div class="node-detail" id="batDetail">--</div>
    </div>
    <div class="flow-node highlight-home">
      <div class="node-icon">🏠</div>
      <div class="node-value" id="homeVal">--</div>
      <div class="node-label">Home</div>
      <div class="node-detail" id="homeDetail">--</div>
    </div>
    <div class="flow-node highlight-grid">
      <div class="node-icon">⚡</div>
      <div class="node-value" id="gridVal">--</div>
      <div class="node-label">Grid</div>
      <div class="node-detail" id="gridDetail">--</div>
    </div>
  </div>

  <!-- Amber -->
  <div class="amber-card" id="amberCard">
    <div>
      <div class="amber-price" id="amberPrice">--</div>
      <div class="amber-price-unit">c/kWh</div>
    </div>
    <div class="amber-meta">
      <span class="amber-period" id="amberPeriod">--</span>
      <div class="amber-descriptor" id="amberDescriptor">--</div>
      <div class="amber-next" id="amberNext">--</div>
    </div>
  </div>

  <!-- Forward Prices -->
  <div class="price-bars">
    <div class="price-bars-label">Next 4 Hours</div>
    <div id="priceBars"><div class="shimmer" style="height:120px;"></div></div>
  </div>

  <!-- Refresh -->
  <div class="refresh-bar">
    <div class="refresh-dot" id="refreshDot"></div>
    <span id="refreshText">Live</span>
  </div>

</div>

<script>
const DATA_URL = 'data/energy-data.json';

function fmtW(val) {
  const abs = Math.abs(val);
  if (abs >= 1000) return (abs / 1000).toFixed(1) + ' kW';
  return Math.round(abs) + ' W';
}

function fmtSignedW(val) {
  if (val == null) return '--';
  const abs = Math.abs(val);
  let s = abs >= 1000 ? (abs / 1000).toFixed(1) + ' kW' : Math.round(abs) + ' W';
  return val >= 0 ? '+' + s : '−' + s;
}

function flowLabel(val, flow) {
  if (flow === 'charging') return 'charging ' + fmtW(Math.abs(val));
  if (flow === 'discharging') return 'discharging ' + fmtW(val);
  if (flow === 'importing') return 'importing ' + fmtW(Math.abs(val));
  if (flow === 'exporting') return 'exporting ' + fmtW(val);
  return 'idle';
}

function updateUI(data) {
  const g = data.goodwe;
  const a = data.amber;

  // Timestamp
  document.getElementById('timestamp').textContent = data.timestamp_display || '--';

  // Battery ring
  const soc = g.battery_soc_pct || 0;
  const circumference = 2 * Math.PI * 78; // ~490
  const dashLen = (soc / 100) * circumference;
  const arc = document.getElementById('batteryArc');
  arc.setAttribute('stroke-dasharray', dashLen + ' ' + circumference);

  // Color the arc by SoC
  let arcColor = 'var(--battery)';
  if (soc < 15) arcColor = '#c0392b';
  else if (soc < 30) arcColor = '#c2680c';
  arc.setAttribute('stroke', arcColor);

  document.getElementById('socValue').textContent = soc;
  document.getElementById('batteryPower').textContent = fmtSignedW(g.battery_power_w);
  document.getElementById('batteryTemp').textContent = (g.battery_temp_c || '--') + '°C';
  document.getElementById('batteryHealth').textContent = (g.battery_soh_pct || '--') + '%';

  // Battery flow badge
  const flowBadge = document.getElementById('batteryFlow');
  const flow = g.battery_flow || 'idle';
  flowBadge.className = 'battery-flow ' + flow;
  if (flow === 'charging') flowBadge.textContent = '⚡ Charging · ' + fmtW(Math.abs(g.battery_power_w || 0));
  else if (flow === 'discharging') flowBadge.textContent = '🔌 Discharging · ' + fmtW(g.battery_power_w || 0);
  else flowBadge.textContent = 'Idle';

  // Flow nodes
  document.getElementById('solarVal').textContent = fmtW(g.solar_now_w || 0);
  document.getElementById('solarDetail').textContent = (g.today_solar_kwh || 0) + ' kWh today';

  document.getElementById('batVal').textContent = soc + '%';
  document.getElementById('batDetail').textContent = g.battery_mode || '--';

  document.getElementById('homeVal').textContent = fmtW(g.home_consumption_w || 0);
  document.getElementById('homeDetail').textContent = 'now';

  const gridW = g.grid_power_w || 0;
  document.getElementById('gridVal').textContent = fmtSignedW(gridW);
  document.getElementById('gridDetail').textContent = g.grid_direction || '--';

  // Amber
  const price = a.current_price_c;
  document.getElementById('amberPrice').textContent = price != null ? price.toFixed(1) : '--';

  const periodEl = document.getElementById('amberPeriod');
  const period = a.period || '';
  periodEl.textContent = period;
  periodEl.className = 'amber-period ' + period;

  document.getElementById('amberDescriptor').textContent = a.descriptor || '';
  const nextEl = document.getElementById('amberNext');
  if (a.next_peak_c != null && a.next_peak_time) {
    nextEl.innerHTML = 'Next peak: <strong>' + a.next_peak_c.toFixed(1) + 'c</strong> at ' + a.next_peak_time +
      (a.next_trough_c != null ? ' · Trough: <strong>' + a.next_trough_c.toFixed(1) + 'c</strong>' : '');
  } else {
    nextEl.textContent = '';
  }

  // Forward price bars
  const barsEl = document.getElementById('priceBars');
  const forward = a.forward_prices || [];
  if (forward.length > 0) {
    const maxPrice = Math.max(...forward.map(f => f.price), 0.1);
    barsEl.innerHTML = forward.map(f => {
      const pct = (f.price / maxPrice) * 100;
      let color = '#b0ada6'; // offPeak default
      if (f.period === 'peak') color = '#c0392b';
      else if (f.period === 'solarSponge') color = '#c2680c';
      const width = Math.max(pct, 4); // minimum bar width visible
      return `<div class="bar-row">
        <span class="bar-time">${f.time}</span>
        <span class="bar-track"><span class="bar-fill" style="width:${width}%;background:${color}"> </span></span>
        <span class="bar-price">${f.price.toFixed(1)}c</span>
      </div>`;
    }).join('');
  } else {
    barsEl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);font-size:0.8rem;">No price data</div>';
  }

  // Refresh indicator
  document.getElementById('refreshDot').classList.remove('stale');
  document.getElementById('refreshText').textContent = 'Live · ' + (data.timestamp_short || 'just now');
}

function showError(msg) {
  document.getElementById('timestamp').textContent = 'Unable to connect';
  document.getElementById('refreshDot').classList.add('stale');
  document.getElementById('refreshText').textContent = msg || 'Connection lost';
}

async function fetchData() {
  try {
    const resp = await fetch(DATA_URL + '?v=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    updateUI(data);
  } catch (e) {
    console.warn('Fetch failed:', e.message);
    showError('Retrying...');
  }
}

// Initial load + refresh every 30 seconds
fetchData();
setInterval(fetchData, 30000);

// Also reload on visibility change (user returns to tab)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') fetchData();
});
</script>
</body>
</html>
